<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VvinampApp</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // While a text field is focused, Compose keeps the typing in a hidden textarea. A click on the
        // page moved focus off it first, and Compose then dropped that click, so buttons like Next
        // needed a second click. Keeping the focus where it is lets the first click through.
        document.addEventListener('mousedown', function (e) {
            var host = document.activeElement;
            var input = host && host.shadowRoot && host.shadowRoot.activeElement;
            if (input && input.tagName === 'TEXTAREA' && e.composedPath().indexOf(input) < 0) e.preventDefault();
        }, true);

        // Compose for web scrolls with the wheel and trackpad, but a mouse drag does nothing. So a
        // left-button press is held back until it's clear what it is: if it starts to drag, the drag is
        // re-sent as wheel scrolling (the same path a two-finger trackpad swipe takes), so click-and-drag
        // scrolls lists, carousels and the player; if it's released without moving, it's replayed as a
        // plain mouse click. An earlier version re-sent presses as touch, which Compose sometimes
        // ignored, so a click or a drag needed a second try. Hovering and the wheel itself are left alone.
        (function () {
            var DRAG_START_PX = 6;
            var press = null; // { target, start, lastX, lastY, dragging }
            function sendPointer(target, from, type, pressed) {
                target.dispatchEvent(new PointerEvent(type, {
                    bubbles: true, cancelable: true, composed: true,
                    pointerId: from.pointerId, pointerType: 'mouse', isPrimary: true,
                    clientX: from.clientX, clientY: from.clientY, screenX: from.screenX, screenY: from.screenY,
                    button: 0, buttons: pressed ? 1 : 0
                }));
            }
            window.addEventListener('pointerdown', function (e) {
                if (!e.isTrusted || e.pointerType !== 'mouse' || e.button !== 0) return;
                if (e.composedPath()[0].tagName !== 'CANVAS') return;
                e.stopImmediatePropagation();
                press = { target: e.composedPath()[0], start: e, lastX: e.clientX, lastY: e.clientY, dragging: false };
            }, true);
            window.addEventListener('pointermove', function (e) {
                if (!press || !e.isTrusted || e.pointerId !== press.start.pointerId) return;
                e.stopImmediatePropagation();
                if (!press.dragging) {
                    var dx0 = e.clientX - press.start.clientX, dy0 = e.clientY - press.start.clientY;
                    if (dx0 * dx0 + dy0 * dy0 < DRAG_START_PX * DRAG_START_PX) return;
                    press.dragging = true;
                }
                // Dragging content up scrolls down, like a finger, so the wheel delta is the opposite of the move.
                press.target.dispatchEvent(new WheelEvent('wheel', {
                    bubbles: true, cancelable: true, composed: true,
                    clientX: press.start.clientX, clientY: press.start.clientY,
                    screenX: press.start.screenX, screenY: press.start.screenY,
                    deltaX: press.lastX - e.clientX, deltaY: press.lastY - e.clientY, deltaMode: 0
                }));
                press.lastX = e.clientX;
                press.lastY = e.clientY;
            }, true);
            ['pointerup', 'pointercancel'].forEach(function (type) {
                window.addEventListener(type, function (e) {
                    if (!press || !e.isTrusted || e.pointerId !== press.start.pointerId) return;
                    e.stopImmediatePropagation();
                    if (!press.dragging && type === 'pointerup') {
                        sendPointer(press.target, press.start, 'pointerdown', true);
                        sendPointer(press.target, e, 'pointerup', false);
                    }
                    press = null;
                }, true);
            });
        })();
    </script>
    <script src="composeApp.js"></script>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
</body>
</html>

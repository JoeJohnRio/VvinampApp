<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VvinampApp</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // While a text field is focused, Compose keeps the typing in a hidden textarea. A click on the
        // page moved focus off it first, and Compose then dropped that click, so buttons like Next
        // needed a second click. Keeping the focus where it is lets the first click through.
        document.addEventListener('mousedown', function (e) {
            var host = document.activeElement;
            var input = host && host.shadowRoot && host.shadowRoot.activeElement;
            if (input && input.tagName === 'TEXTAREA' && e.composedPath().indexOf(input) < 0) e.preventDefault();
        }, true);
    </script>
    <script src="composeApp.js"></script>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
</body>
</html>

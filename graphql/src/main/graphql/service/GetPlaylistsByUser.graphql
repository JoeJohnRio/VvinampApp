query GetPlaylistsByUser($userId: ID!, $after: String) {
    getPlaylistsByUser(userId: $userId, after: $after) {
        totalCount
        pageInfo {
            hasNextPage
            endCursor
        }
        edges {
            cursor
            node {
                id
                title
                coverImage
                savedCount
                isSavedByMe
                creator {
                    username
                }
            }
        }
    }
}
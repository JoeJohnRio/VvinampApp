query GetArtistScreenData($artistId: ID!) {
  getArtistScreenData(artistId: $artistId) {
    artistProfile {
      id
      name
      bio
      profileImage
      verified
      monthlyListeners
    }
    topSongs {
      success
      error
      tracks {
        id
        title
        duration
        albumCoverUrl
        artistName
        streamCount
        explicit
        releaseDate
      }
    }
    topReleases {
      success
      error
      albums {
        id
        title
        releaseDate
        coverArt
      }
    }
  }
}
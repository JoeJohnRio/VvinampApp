query GetMyPlaylists($after: String) {
    getMyPlaylists(after: $after) {
        totalCount
        pageInfo {
            hasNextPage
            hasPreviousPage
            startCursor
            endCursor
        }
        edges {
            cursor
            node {
                id
                title
                coverImage
                albumCovers
                savedCount
                isSavedByMe
                creator {
                    username
                }
            }
        }
    }
}
mutation PlayContext($context: PlaybackContextInput!, $offsetTrackId: ID!) {
  playContext(context: $context, offsetTrackId: $offsetTrackId) {
    queue {
      currentTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
        artistId
        albumId
      }
      upcomingTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
        artistId
        albumId
      }
      previousTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
        artistId
        albumId
      }
    }
    playbackInfo {
      hlsUrl
      mp3Fallback
      youtubeId
      durationMs
    }
  }
}
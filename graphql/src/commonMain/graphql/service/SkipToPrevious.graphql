mutation SkipToPrevious {
  skipToPrevious {
    queue {
      currentTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
      }
      previousTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
      }
      upcomingTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
      }
    }
    playbackInfo {
      hlsUrl
      mp3Fallback
      youtubeId
      durationMs
    }
  }
}
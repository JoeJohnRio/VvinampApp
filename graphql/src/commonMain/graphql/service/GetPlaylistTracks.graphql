query GetPlaylistTracks($playlistId: ID!, $after: String, $sortBy: PlaylistTrackSortBy = RECENTLY_ADDED) {
    getPlaylistTracks(playlistId: $playlistId, after: $after, sortBy: $sortBy) {
        edges {
            node {
                track {
                    id
                    title
                    duration
                    streamCount
                    audioFileUrl
                    albumCoverUrl
                    artistName
                    explicit
                    lyrics
                    releaseDate
                }
            }
        }

        pageInfo {
            hasNextPage
            hasPreviousPage
            startCursor
            endCursor
        }
    }
}

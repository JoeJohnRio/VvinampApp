mutation SkipToNext {
  skipToNext {
    queue {
      currentTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
        artistId
        albumId
      }
      previousTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
        artistId
        albumId
      }
      upcomingTrack {
        trackId
        title
        artist
        coverImageUrl
        artistBio
        artistProfileImageUrl
        artistMonthlyListeners
        artistId
        albumId
      }
    }
    playbackInfo {
      hlsUrl
      mp3Fallback
      youtubeId
      durationMs
    }
  }
}

mutation AddToQueue($ids: [ID!]!) {
  addToQueue(trackIds: $ids) {
    currentTrack {
      trackId
      title
      artist
      coverImageUrl
      artistBio
      artistProfileImageUrl
      artistMonthlyListeners
      artistId
      albumId
    }
    previousTrack {
      trackId
      title
      artist
      coverImageUrl
      artistBio
      artistProfileImageUrl
      artistMonthlyListeners
      artistId
      albumId
    }
    upcomingTrack {
      trackId
      title
      artist
      coverImageUrl
      artistBio
      artistProfileImageUrl
      artistMonthlyListeners
      artistId
      albumId
    }
  }
}
